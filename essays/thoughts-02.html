    <header class="article-header"><p class="category">思考 / 02</p><h1>秩序的荒诞论</h1><p class="status">27/9/2026</p></header>
    <div class="article-body"><!-- 从这里开始填写。修改标题、日期和下面的段落即可。 --><p class="placeholder">秩序是看着很合理的东西。
    </p><p>秩序用来维护这个社会稳定的运转。从有意识的那一刻起，被教导以遵守规则，这使得社会增添的有意识的群体遵守同样一种规则。
    正因为遵守着同一种规则，才对人有着很强的约束力。</p>
    <p>
        但此外，我经常假想一个假设，这里根本没有绝对的秩序可言。一切都是荒诞的，又从何而来所谓的正确。一个人可以生存也可以死亡，一个团体可以有序也可以混乱。哥德尔不完备定理或许是我想说的，这一切的逻辑
        并不能证明其根基的正确性。
    </p></div>
